<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تسجيل الدخول | Unshaken</title>
<style>
body{background:#111;color:#EDE6D6;font-family:Tahoma,sans-serif;max-width:900px;margin:0 auto;padding:48px 24px;text-align:right}
h1{color:#D6B87E;font-size:30px}
p.sub{color:#B08D57;font-size:16px}
.box{background:#1b1b1b;border:1px solid #333;border-radius:8px;padding:16px;margin-top:20px;word-break:break-all;font-family:monospace;font-size:14px;max-height:160px;overflow:auto}
button{margin-top:14px;background:#D6B87E;color:#111;border:none;padding:10px 22px;border-radius:6px;font-size:15px;cursor:pointer}
button:hover{opacity:.85}
.empty{color:#888}
</style>
</head>
<body>
<h1 id="title">جاري التحقق...</h1>
<p class="sub" id="sub"></p>
<div class="box" id="code">—</div>
<button id="copyBtn" style="display:none">نسخ</button>
<script>
const params = new URLSearchParams(window.location.search);
const code = params.get("code");
const err = params.get("error") || params.get("error_description");
const titleEl = document.getElementById("title");
const subEl = document.getElementById("sub");
const codeEl = document.getElementById("code");
const btn = document.getElementById("copyBtn");
if (code) {
  titleEl.textContent = "تم تسجيل الدخول";
  subEl.textContent = "انسخ الكود ده وارجع للإعداد.";
  codeEl.textContent = code;
  btn.style.display = "inline-block";
  btn.onclick = () => { navigator.clipboard.writeText(code); btn.textContent = "تم النسخ!"; };
} else if (err) {
  titleEl.textContent = "حصل خطأ";
  subEl.textContent = err;
  codeEl.className = "box empty";
  codeEl.textContent = "—";
} else {
  titleEl.textContent = "مفيش كود ظاهر";
  subEl.textContent = "افتح الصفحة دي بعد ما توافق على صلاحيات TikTok.";
  codeEl.className = "box empty";
  codeEl.textContent = "—";
}
</script>
</body>
</html>
